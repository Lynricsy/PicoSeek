<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- theme-color 只能有一个生效值，媒体查询版本无法反映手动选择的主题；
         因此这里给出浅色初值，由启动脚本与 ThemeProvider 按已解析主题同步。 -->
    <meta name="theme-color" content="#f7f5f0" />
    <link rel="icon" href="/brand/favicon.ico" sizes="16x16 32x32 48x48" />
    <link
      rel="icon"
      href="/brand/icon-192.png"
      type="image/png"
      sizes="192x192"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>PicoSeek · 循证医学文献问答</title>
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem('picoseek.theme')
        var d =
          t === 'dark' ||
          (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (d) document.documentElement.classList.add('dark')
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', d ? '#232120' : '#f7f5f0')
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
