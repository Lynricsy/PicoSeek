name: picoseek
description: "PicoSeek 移动/桌面客户端：基于文献证据的临床问答。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 路由
  go_router: ^18.0.1

  # 模型
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 网络（含 SSE 流式读取）
  http: ^1.6.0

  # 存储
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5

  # Markdown 解析（渲染自实现）
  markdown: ^7.3.1

  # 外链
  url_launcher: ^6.3.0

  # 导出 PDF 的落盘去向：桌面另存为对话框、Android 分享面板（先写应用临时目录）
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  riverpod_lint: ^3.1.9
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  # 品牌资源：唯一源 docs/assets/logo-source.png，由 tools/generate_brand_assets.py 生成。
  # 2.0x / 3.0x 变体按目录约定自动解析，无需逐条声明。
  assets:
    - assets/brand/logo.png
    # Linux 运行时从 bundle 里按可执行文件相对路径读它作窗口图标。
    - assets/brand/app-icon.png

  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-VF.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
