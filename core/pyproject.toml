[project]
name = "picoseek-core"
version = "0.1.0"
description = "PicoSeek 内核：文献检索、全文解析、原子知识库、期刊分区"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "numpy>=1.26", "pypdf>=4", "mcp>=1.29,<2"]

[project.optional-dependencies]
embed = ["torch>=2.2", "sentence-transformers>=3"]
# 可选后端 EMBED_BACKEND=onnx 需要 optimum[onnxruntime]，故意**不**写在这里：
# uv 的 lock 对所有 extra 统一求解，optimum 会把 transformers 压到 <5、连带把
# sentence-transformers 从 6.0.1 拖回 5.7.0——即便没人装这个 extra 也一样生效。
# 装法与代价见 core/README.md「6.3 可选：ONNX int8 后端」。
paywall = ["playwright>=1.45"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "picos_paths",
  "literature",
  "ask",
  "knowledge_store",
  "journal_rank",
  "semantic_scholar_mcp",
  "paywall_fetch",
  "spider_auth",
  "verify_citations",
  "ingest",
  "interpret",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
