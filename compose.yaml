x-app: &app
  build: { context: ., target: runtime }
  image: picoseek:local
  env_file: [{ path: .env, required: false }]
  environment:
    PICOSEEK_DATA: /data
    PICOSEEK_REDIS_URL: redis://redis:6379/0
    PICOSEEK_DATABASE_URL: sqlite:////data/var/api.sqlite3
    LLM_BASE: ${LLM_BASE:-http://host.docker.internal:4000/v1}
    LLM_MODEL: ${LLM_MODEL:-qwen3-14b}
    LOCAL_QWEN_KEY: ${LOCAL_QWEN_KEY:-sk-123456}
    NCBI_API_KEY: ${NCBI_API_KEY:-}
    S2_API_KEY: ${S2_API_KEY:-}
  volumes:
    - ./core/answers:/data/answers
    - ./core/library:/data/library
    - ./core/kb:/data/kb
    - ./core/data:/data/data
    - ./core/models:/data/models:ro
    - ./core/pdfs:/data/pdfs
    - ./core/docsets:/data/docsets
    - ./var:/data/var
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  migrate:
    <<: *app
    command: ["picoseek", "migrate"]

  api:
    <<: *app
    restart: unless-stopped
    ports: ["${PICOSEEK_PORT:-8765}:8765"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    restart: unless-stopped
    command: ["picoseek", "worker"]
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: frontend }
    image: picoseek-web:local
    restart: unless-stopped
    ports: ["${PICOSEEK_WEB_PORT:-39109}:80"]
    depends_on:
      api: { condition: service_healthy }

  test:
    profiles: [test]
    build: { context: ., target: test }
    image: picoseek:test
    environment:
      PICOSEEK_DATA: /tmp/picoseek-data
      PICOSEEK_REDIS_URL: redis://redis:6379/15
    depends_on:
      redis: { condition: service_healthy }
    command: ["pytest", "-q"]

volumes:
  redis-data:
